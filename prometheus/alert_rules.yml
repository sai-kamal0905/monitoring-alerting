groups:
  - name: app_alerts
    rules:
      - alert: WebAppErrorRateHigh
        expr: increase(app_errors_total{job="web"}[1m]) > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          description: "Web service errors detected on {{ $labels.instance }}"

      - alert: ApiErrorRateHigh
        expr: increase(app_errors_total{job="api"}[1m]) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          description: "API service errors detected on {{ $labels.instance }}"

      - alert: DatabaseHighConnections
        expr: pg_stat_activity_count{datname="devops"} > 50
        for: 1m
        labels:
          severity: critical
        annotations:
          description: "Database connection count exceeded safe limit."

      - alert: InstanceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          description: "Instance {{ $labels.instance }} of job {{ $labels.job }} is down"

      - alert: DatabaseConnectionsElevated
        expr: instance:pg_connections:ratio > 0.6
        for: 3m
        labels:
          severity: warning
        annotations:
          description: "DB connections on {{ $labels.instance }} at {{ $value | printf \"%.0f\" }}x of max_connections capacity, sustained 3m+."
 
      - alert: DatabaseHighConnections
        expr: instance:pg_connections:ratio > 0.85
        for: 2m
        labels:
          severity: critical
        annotations:
          description: "DB connections on {{ $labels.instance }} at {{ $value | printf \"%.0f\" }}x of max_connections capacity, sustained 2m+ — risk of exhaustion."
 
      - alert: DatabaseHighConnectionsFixedFallback
        expr: avg_over_time(pg_stat_activity_count{datname="devops"}[2m]) > 50
        for: 2m
        labels:
          severity: critical
        annotations:
          description: "DB connection count on {{ $labels.instance }} averaged above 50 for 2m+ (fixed-threshold fallback, no max_connections metric available)."

